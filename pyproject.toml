[project]
name = "backend"
version = "0.1.0"
description = "Backend for Green Leaders app"
authors = [
    {name = "Pavel Syomin",email = "pas.ntg@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "ezdxf (>=1.4.4,<2.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "overturemaps (>=1.0.2,<2.0.0)",
    "geopandas (>=1.1.4,<2.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "typer (>=0.15.0,<1.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyproj (>=3.8.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[project.scripts]
greenplan = "greenplan.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
httpie = "^3.2.4"

[tool.poetry]
packages = [{include = "greenplan"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
