# Setback distances (meters, from the obstacle to the plant's axis), per the
# project's rule table (Google Sheet "Правила размещения растений в городской
# среде", verified 2026-09-28) cross-checked against the local ../НПА/ copies:
#   - 743-ПП, табл. 3.6.1 (reproduces МГСН 1.01-99) -- buildings, schools,
#     tram, footpath/carriageway edges, masts, slopes, retaining walls, utilities
#   - СП 42.13330.2016, табл. 9.1 -- same rows; adds "край трамвайного полотна"
#   - МГСН 1.02-02, табл. 9.1 -- tree distance by street category
#   - ПП РФ от 24.02.2009 № 160 / ПУЭ -- overhead power lines (these rows come
#     from the rule table only; the acts themselves are not in ../НПА/)
#
# Conventions:
#   - Ranges (e.g. "5-7") use the UPPER bound.
#   - "-" (no shrub distance in the source) reuses the tree distance
#     (conservative), unless another row sets a shrub distance for the same
#     boundary -- the street-category rows fall back to the generic
#     carriageway-edge shrub value (1.0).
#   - Categories/subtypes the parser doesn't emit yet (e.g. school buildings,
#     street categories, power-line voltages) are inert until a data source
#     (plan rules or Overture fusion) produces them.
#
# existing_tree is not from table 3.6.1: it's the single-row spacing along
# roads, 743-ПП табл. 3.6.2 ("5-6"). The shrub value (1.5) has no source row;
# kept from the prototype.

# --- Здания ---------------------------------------------------------------

- obstacle_category: buildings
  obstacle_subtype: null
  tree_m: 5.0
  shrub_m: 1.5
  citation: "743-ПП, табл. 3.6.1 (МГСН 1.01-99) — наружная стена здания и сооружения"

- obstacle_category: buildings
