# Setback distances (meters, from the obstacle to the plant's axis), per the
# project's rule table (Google Sheet "Правила размещения растений в городской
# среде", verified 2026-09-28) cross-checked against the local ../НПА/ copies:
#   - 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (reproduces МГСН 1.01-99) --
#     buildings, schools, tram, footpath/carriageway edges, masts, slopes,
#     retaining walls, utilities
#   - СП 42.13330.2016, п. 9.6, табл. 9.1 -- same rows; adds "край трамвайного
#     полотна"
#   - МГСН 1.02-02 (623-ПП, ред. 903-ПП), п. 9.2.2.2, табл. 9.1 -- tree
#     distance by street category
#   - ПП РФ от 24.02.2009 № 160 / ПУЭ -- overhead power lines (these rows come
#     from the rule table only; the acts themselves are not in ../НПА/, so
#     their clause is left null)
# Clauses/URLs were also cross-checked against the frontend's
# contracts/norms-verified.md (2026-09-27).
#
# Per row: `citation` is the short string shown with a prohibited zone;
# `act`/`source_url` name the source; `tree`/`shrub` say per plant type
# whether the value is from the act (`basis: regulation` + `clause`) or the
# service's own choice where the act sets none (`basis: service_default`,
# own `citation` that doesn't present it as the act's requirement). `text`
# is the full wording for `GET /norms`. See greenplan/norms/schema.py.
#
# Conventions:
#   - Ranges (e.g. "5-7") use the UPPER bound.
#   - "-" (no shrub distance in the source) means "not set by the act"; the
#     service reuses the tree distance (conservative) as a service_default,
#     unless another row sets a shrub distance for the same boundary -- the
#     street-category rows use the generic carriageway-edge shrub value (1.0).
#   - Categories/subtypes the parser doesn't emit yet (e.g. power-line
#     voltages) are inert until a data source (plan rules or Overture fusion)
#     produces them.
#   - Row ids are stable (the frontend refers to `<id>-tree`/`<id>-shrub`).

# --- Здания ------------------------------------------------------------------
- id: 743-pp-building
  obstacle_category: buildings
  obstacle_subtype: null
  tree_m: 5.0
  shrub_m: 1.5
  citation: "743-ПП, табл. 3.6.1 (МГСН 1.01-99) — наружная стена здания и сооружения"
  act: "ПП Москвы от 10.09.2002 № 743-ПП, прил. 1"
  source_url: "https://base.garant.ru/378956/53f89421bbdaf741eb2d1ecc4ddb4c33/"
  tree:
    basis: regulation
    clause: "п. 3.6.3, табл. 3.6.1, строка «Наружная стена здания и сооружения»"
    text: "Не менее 5,0 м от наружной стены здания и сооружения до оси ствола дерева. Норма относится к деревьям с диаметром кроны не более 5 м; для деревьев с большей кроной расстояние увеличивается (прим. 1 к табл. 3.6.1). Деревья с широкой кроной (липа, клён, дуб, каштан, тополь и др.), затеняющие жилые помещения, сажают не ближе 10 м от здания (прим. 3 к табл. 3.6.1)."
  shrub:
    basis: regulation
    clause: "п. 3.6.3, табл. 3.6.1, строка «Наружная стена здания и сооружения»"
    text: "Не менее 1,5 м от наружной стены здания и сооружения до оси кустарника."

