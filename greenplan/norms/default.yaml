# 743-ПП setback distances (meters), ported from the prior agent's prototype
# (Олимпийская деревня/Результат_агента/код_и_контекст/full4_run.py's
# NORMS/CURB_NORM/EXIST_TREE_SPACING + full7_assemble.py's REFS), sourced from
# "Правила размещения растений в городской среде.xlsx".
#
# No article/clause numbers are available in the source data -- citations are
# act name + free-text table row, exactly as the prototype recorded them.
#
# Known data-quality caveats (kept from the prototype rather than silently
# "fixed", since they're the best evidence currently available):
#   - existing_tree tree_m (5.0) was recovered from a corrupted Excel cell:
#     the original range was "5-6" m, misread by Excel as a date; the lower
#     (more conservative) bound was kept.
#   - gas/sewer/drainage/water/other_utility shrub_m values have no separate
#     source number and conservatively reuse the tree_m value.

