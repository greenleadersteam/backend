    text: "Не менее 2,0 м от подземной сети (кабель связи) до оси ствола дерева. Норма относится к деревьям с диаметром кроны не более 5 м; для деревьев с большей кроной расстояние увеличивается (прим. 1 к табл. 3.6.1)."
  shrub:
