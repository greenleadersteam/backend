# Default rule pack, ported from the original backend/dxf_layers.py RULES
# table (MVP subset of the 21-item regulatory requirement list: Group 0
# (1-2), Group 1 (3-7), cheap Group 2 (8, 11, 12), red lines & contours (19,
# 20 partial)).
#
# Matching is tried against the entity's own layer name, then (for INSERT
# entities only) against the referenced block name, first rule wins.
#
# expand_blocks: some buildings/utilities/walls are drawn as block
# references rather than raw polylines; for those the block's own geometry
# is the real shape, so a matching INSERT should be exploded into its child
# geometry instead of reduced to its insertion point. Point-symbol
# categories (trees, poles, wells) leave this unset on purpose: the
# insertion point *is* the meaningful data there.
#
# status documents how much to trust an automatic match:
#   auto                 - name is a confirmed, stable convention across projects
#   auto_partial         - layer itself is reliable, but the requirement asks for
#                           more than this layer alone provides
#   proxy_low_confidence - no dedicated layer exists for the exact requirement;
#                           this is the closest available stand-in
#   no_default_source    - no confirmed layer name exists in projects inspected
#                           so far; kept so the tool still finds it where it
#                           exists, expect zero matches on many inputs

- id: "1"
  key: site_boundary
  name_ru: "Граница участка проектирования"
  group: 0
  status: auto
  layer_pattern: "границ.*работ"

- id: "3"
  key: underground_utilities
  name_ru: "Подземные инженерные сети"
  group: 1
  status: auto
  layer_pattern: "газопровод|канализац|водосток|водопровод|дренаж|теплосет|кабел|коллектор|подземн.*коммуникац"
  expand_blocks: true
  subtypes:
    - {key: gas, pattern: "газопровод"}
    - {key: sewer, pattern: "канализац|водосток"}
    - {key: water, pattern: "водопровод"}
    - {key: drainage, pattern: "дренаж"}
    - {key: heat, pattern: "теплосет"}
    - {key: power_cable, pattern: "кабел.*электр"}
    - {key: comm_cable, pattern: "кабел.*связ"}
    - {key: other_utility, pattern: "кабел|коллектор|подземн.*коммуникац"}

- id: "4"
  key: buildings
  name_ru: "Здания и сооружения"
  group: 1
  status: auto
  # Not full-string-anchored (unlike an earlier version of this rule): a
  # provider that binds an xref instead of leaving it external renames the
  # child layer to "<original-name>|Здания" or "<original-name>$0$Здания"
  # (confirmed on real objects), which a "^...$" anchor never matches even
  # though the content is exactly the same category.
  layer_pattern: "Здания|Части зданий"
  expand_blocks: true

- id: "5"
  key: road_edge
  name_ru: "Улично-дорожная сеть (край проезжей части — прокси: бортовой камень/kerb)"
  group: 1
  status: proxy_low_confidence
  # "_Борт_": designed kerbs ("ДВ_ГП_П_Борт_БР100.30.15", "..._Борт_Пониженный")
  layer_pattern: "бортовой камень|_борт_|\\bkerb\\b|\\bcurb\\b"
  expand_blocks: true

# Carriageway surface. Two rules, same category: pavement-work fills naming a
# street category ("ДВ_ПП_ДО_Тип1_Ремонт_покрытия_ПЧ_магистральные") carry it
# as a subtype hint; plain carriageway polygons ("ДВ_ГП_П_ДО_ПЧ") have none.
# greenplan.fusion.roads refines both into a final street category.
- id: "5a"
  key: carriageway
  name_ru: "Проезжая часть (с указанием категории улицы в проекте)"
  group: 1
  status: auto
  layer_pattern: "ДО_Тип.*(магистрал|местн)"
  subtypes:
    - {key: arterial, pattern: "магистрал"}
    - {key: local, pattern: "местн"}

- id: "5b"
  key: carriageway
  name_ru: "Проезжая часть"
  group: 1
  status: auto
  layer_pattern: "ДО_ПЧ|проезж.*част"

- id: "6"
  key: footpath_edge
  name_ru: "Дорожно-тропиночная сеть и тротуары (край покрытия)"
  group: 1
  status: no_default_source
  # "_трот": pavement-work fills ("ДВ_ПП_ДО_Тип5б_Капремонт_трот")
  layer_pattern: "тротуар|_трот|дорожно.?тропин|пешеход|sidewalk"

- id: "7"
  key: green_existing
  name_ru: "Существующие зелёные насаждения"
  group: 1
  status: auto
  layer_pattern: "дендр|отдельно сто.*дерев|полоса дерев|газон|гзн|\\bgrass\\b|кустарник"
  subtypes:
    # "гзн" catches the abbreviated zone-fill-diagram HATCH layers (e.g.
    # "_ГЗН-ГЗН", "_АБ ТР-ГЗН") that a dedicated landscaping "Заливка"/fill
    # file uses for the actual plantable lawn extent -- this is the reliable
    # lawn-area source (confirmed by a prior agent's session), unlike a raw
    # topo-survey "Леса и газоны" layer, which mixes a few real fills with
    # many tiny decorative grass-symbol strokes (LINE/ARC/POINT ticks, plus
    # occasional small closed loops) that are not real area boundaries.
    # "grass" (English) catches a different provider's own zone-fill-diagram
    # convention (e.g. "!Project_hatch road grass") -- same concept, another
    # naming dialect; this is exactly the kind of per-provider gap the rule
    # pack is meant to absorb without a code change.
    - {key: lawn, pattern: "газон|гзн|\\bgrass\\b"}
    - {key: existing_tree, pattern: "дендр|отдельно сто.*дерев"}
    - {key: tree_strip, pattern: "полоса дерев"}
    - {key: shrub_existing, pattern: "кустарник"}

- id: "8"
  key: poles_masts
  name_ru: "Опоры и мачты"
  group: 2
  status: auto
  # "Фонари"/"Столбы"/"Светофоры": survey layers for lamp posts, poles and
  # traffic-light posts (present in ~19 of 20 pilot objects)
  layer_pattern: "опор|мачт|колонн|фонар|столб|светофор"

- id: "91"
  key: overhead_power_lines
  name_ru: "Воздушные линии электропередачи"
  group: 2
  status: auto_partial
  # Voltage isn't in the layer name ("ЛЭП"), so no subtype: the generic
  # overhead-line norm applies until a voltage source (e.g. Overture) exists.
  layer_pattern: "ЛЭП|\\bВЛ\\b|воздушн.*лини"

- id: "11"
  key: retaining_walls_slopes
  name_ru: "Подпорные стенки, откосы, террасы"
  group: 2
  status: auto
  layer_pattern: "откос|подпорн.*стенк|терас|террас"
  expand_blocks: true
  subtypes:
    # retaining_wall first: a mixed layer ("Подпорные стенки и откосы") gets
    # the larger of the two setbacks
    - {key: retaining_wall, pattern: "подпорн.*стенк"}
    - {key: slope, pattern: "откос|терас|террас"}

- id: "12"
  key: wells_hatches
  name_ru: "Колодцы, люки, камеры, дождеприёмники"
  group: 2
  status: auto
  layer_pattern: "колодц|люк|дождеприемник|дождеприёмник|камера смотр"

- id: "19"
  key: red_lines
  name_ru: "Красные линии (без кадастровых границ)"
  group: 4
  status: auto_partial
  # See rule "4"'s comment: not full-string-anchored, so a bound-xref
  # child layer like "...|КРАСНЫЕ_ЛИНИИ_Красные линии" still matches.
  layer_pattern: "Красные линии"

- id: "20"
  key: contours
  name_ru: "Рельеф — горизонтали (без вычисления уклонов)"
  group: 4
  status: auto_partial
  # See rule "4"'s comment: not full-string-anchored, so a bound-xref
  # child layer like "output[1-8]_..._tp$0$Горизонтали" still matches.
  layer_pattern: "Горизонтали"

- id: "90"
  key: geodetic_points
  name_ru: "Геодезические пункты (опорные точки топографической съёмки)"
  group: 4
  status: auto
  # Not one of the ТЗ's numbered requirement items (hence id 90, well outside
  # the 1-20 range used above) -- kept purely as a tracked/exported category
  # rather than falling into "unmatched", since a point-based DXF
  # georeferencing workflow depends on being able to find these
  # automatically. Confirmed as a stable literal layer name (modulo the same
  # bound-xref prefix noise as above) across the large majority of pilot
  # objects inspected so far.
  layer_pattern: "геодезич.*пункт"
