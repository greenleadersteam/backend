# Right now this runs standalone from inside the backend repo (build
# context `.`). When the frontend repo is ready, the cleanest path is to
# move this file + Caddyfile up one level into a parent directory that has
# both repos cloned as siblings (see DEPLOY.md), change `build: .` below to
# `build: ./backend`, and add a `frontend: {build: ./frontend, ...}` service
# alongside it -- Caddy then just gets a second subdomain block.

services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      GREENPLAN_API_DATA_DIR: /data
      GREENPLAN_API_MAX_CONCURRENT_JOBS: "2"
      GREENPLAN_API_MAX_UPLOAD_MB: "100"
      # Comma-separated browser origins allowed to call this API. The
      # localhost/127.0.0.1 dev-server entries here are harmless in
      # production -- they only let *your own* frontend dev server (running
      # on a developer's own machine) call the deployed API, not arbitrary
      # third-party sites. See config.py's default for the full list this
      # overrides.
      GREENPLAN_API_CORS_ORIGINS: >-
        https://app.greenleaders.online,
        http://localhost:5173,http://127.0.0.1:5173,
        http://localhost:3000,http://127.0.0.1:3000,
        http://localhost:4200,http://127.0.0.1:4200,
        http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - backend_data:/data
    networks: [internal]

  # frontend:                      # once this compose file has moved up a
  #   build: ./frontend             # level to sit next to both repos, see
  #   restart: unless-stopped       # the comment at the top of this file
  #   environment:
  #     API_BASE_URL: https://backend.greenleaders.online
  #   networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [backend]

volumes:
  backend_data:
  caddy_data:
  caddy_config:

networks:
  internal:
